<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>C# · capitole și subcapitole</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      overflow-x: hidden;
      width: 100%;
    }

    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      line-height: 1.6;
      color: #2c2a2f;
      background-color: #F7ECE1;
      min-height: 100vh;
      overflow-x: hidden;
      width: 100%;
      max-width: 100vw;
      position: relative;
    }

    a, .nav-link, .bar, .highlight, .chapter-card, .sub-item {
      transition: all 0.25s ease;
    }

    header {
      background: linear-gradient(145deg, #CAC4CE 0%, #8D86C9 100%);
      box-shadow: 0 8px 24px rgba(114, 90, 193, 0.15);
      border-bottom: 1px solid rgba(255, 238, 221, 0.4);
      backdrop-filter: blur(2px);
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
    }

    .navbar {
      min-height: 76px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 32px;
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
    }

    .nav-branding {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: #F7ECE1;
      text-shadow: 0 2px 8px rgba(114, 90, 193, 0.3);
      transition: 0.3s;
      text-decoration: none;
      position: relative;
      z-index: 1001;
    }
    .nav-branding::after {
      content: '';
      position: absolute;
      bottom: 4px;
      left: 0;
      width: 0;
      height: 3px;
      background: #FFEEDD;
      border-radius: 4px;
      transition: width 0.4s ease;
    }
    .nav-branding:hover::after {
      width: 80%;
    }
    .nav-branding:hover {
      transform: scale(1.02);
      color: #ffffff;
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 40px;
      list-style: none;
    }

    .nav-link {
      color: #F7ECE1;
      text-decoration: none;
      font-weight: 500;
      font-size: 1.05rem;
      padding: 6px 0;
      position: relative;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: #FFEEDD;
      border-radius: 4px;
      transition: width 0.35s ease;
    }
    .nav-link:hover {
      color: #ffffff;
    }
    .nav-link:hover::after {
      width: 100%;
    }

    .hamburger {
      display: none;
      cursor: pointer;
      flex-direction: column;
      gap: 5px;
      padding: 6px 4px;
      z-index: 1001;
      position: relative;
    }
    .bar {
      display: block;
      width: 28px;
      height: 3px;
      background: #F7ECE1;
      border-radius: 6px;
      transition: all 0.3s ease-in-out;
      transform-origin: center;
    }

    @media (max-width: 768px) {
      .navbar { padding: 0 20px; min-height: 70px; }
      .nav-branding { font-size: 1.8rem; }
      .hamburger { display: flex; }
      .nav-menu {
        position: fixed;
        left: -100%;
        top: 70px;
        flex-direction: column;
        background: linear-gradient(160deg, #CAC4CE 0%, #8D86C9 100%);
        width: 100%;
        max-width: 100vw;
        padding: 28px 0;
        gap: 24px;
        box-shadow: 0 18px 40px rgba(114, 90, 193, 0.2);
        transition: 0.35s cubic-bezier(0.23, 1, 0.32, 1);
        backdrop-filter: blur(6px);
        border-top: 1px solid rgba(255, 238, 221, 0.25);
      }
      .nav-menu.active { left: 0; }
      .nav-item { margin: 0; width: 100%; text-align: center; }
      .nav-link { font-size: 1.2rem; display: block; width: 100%; }
      .hamburger.active .bar:nth-child(1) { transform: translateY(8px) rotate(45deg); }
      .hamburger.active .bar:nth-child(2) { opacity: 0; transform: scaleX(0); }
      .hamburger.active .bar:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
    }

    @media (max-width: 480px) {
      .navbar { padding: 0 16px; min-height: 64px; }
      .nav-branding { font-size: 1.6rem; }
      .nav-menu { top: 64px; }
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px;
      width: 100%;
      overflow-wrap: break-word;
      word-wrap: break-word;
      word-break: break-word;
    }

    .page-title {
      font-size: 2.6rem;
      color: #725AC1;
      margin: 12px 0 28px 0;
      padding-bottom: 14px;
      border-bottom: 4px solid #8D86C9;
      display: inline-block;
      letter-spacing: -0.5px;
      animation: fadeSlide 0.8s ease forwards;
    }
    .page-title::before {
      content: '\1F4D6 ';
      font-size: 2.2rem;
    }

    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(18px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .chapters-grid {
      display: flex;
      flex-direction: column;
      gap: 28px;
      margin-top: 16px;
    }

    .chapter-card {
      background: rgba(255, 238, 221, 0.6);
      backdrop-filter: blur(8px);
      border-radius: 36px;
      padding: 24px 30px 28px;
      border: 1px solid rgba(202, 196, 206, 0.3);
      box-shadow: 0 8px 28px rgba(141, 134, 201, 0.06);
      transition: 0.3s ease;
      animation: cardEntry 0.7s ease forwards;
      opacity: 0;
      transform: translateY(20px);
      width: 100%;
    }

    @keyframes cardEntry {
      0% { opacity: 0; transform: translateY(28px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .chapter-card:hover {
      transform: translateY(-6px) scale(1.003);
      background: rgba(255, 238, 221, 0.85);
      border-color: #CAC4CE;
      box-shadow: 0 16px 44px rgba(114, 90, 193, 0.08);
    }

    .chapter-header {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 12px 20px;
      margin-bottom: 12px;
      cursor: default;
    }
    .chapter-nr {
      font-size: 1.8rem;
      font-weight: 600;
      color: #8D86C9;
      opacity: 0.7;
      letter-spacing: -0.5px;
      background: rgba(202, 196, 206, 0.2);
      padding: 2px 14px;
      border-radius: 60px;
    }
    .chapter-title-link {
      font-size: 1.7rem;
      font-weight: 600;
      color: #725AC1;
      letter-spacing: -0.3px;
      background: transparent;
      border: none;
      text-decoration: none;
      transition: 0.2s;
      cursor: pointer;
      display: inline-block;
    }
    .chapter-title-link:hover {
      color: #8D86C9;
      transform: translateX(4px);
    }

    .chapter-title-link.unavailable {
      color: #CAC4CE;
      cursor: pointer;
      position: relative;
    }
    .chapter-title-link.unavailable:hover {
      color: #8D86C9;
      transform: translateX(4px);
    }

    .chapter-desc {
      font-size: 0.98rem;
      color: #4b4752;
      margin: 4px 0 14px 0;
      padding-left: 8px;
      border-left: 3px solid #CAC4CE;
      padding-left: 16px;
      word-break: break-word;
    }

    .sub-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      margin-top: 6px;
      padding-left: 12px;
    }
    .sub-item {
      background: rgba(247, 236, 225, 0.5);
      backdrop-filter: blur(4px);
      padding: 8px 20px;
      border-radius: 60px;
      border: 1px solid rgba(202, 196, 206, 0.25);
      font-size: 0.95rem;
      font-weight: 500;
      color: #3d3a42;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(114, 90, 193, 0.02);
      transition: 0.25s ease;
      cursor: pointer;
      position: relative;
      white-space: nowrap;
    }
    .sub-item::before {
      content: '\25B9';
      color: #8D86C9;
      font-size: 1.1rem;
      transition: 0.25s;
    }
    .sub-item:hover {
      background: #8D86C9;
      color: #F7ECE1;
      border-color: #725AC1;
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 8px 20px rgba(114, 90, 193, 0.15);
    }
    .sub-item:hover::before {
      color: #FFEEDD;
      transform: rotate(90deg);
    }

    .back-link {
      display: inline-block;
      margin-top: 40px;
      padding: 12px 28px;
      background: #CAC4CE;
      color: #2c2a2f;
      border-radius: 60px;
      text-decoration: none;
      font-weight: 500;
      box-shadow: 0 4px 12px rgba(114, 90, 193, 0.08);
      transition: 0.3s;
      border: 1px solid rgba(255, 238, 221, 0.3);
    }
    .back-link:hover {
      background: #8D86C9;
      color: #F7ECE1;
      transform: translateX(-6px) scale(1.02);
      box-shadow: 0 10px 28px rgba(114, 90, 193, 0.15);
    }
    .back-link::before {
      content: '\2190 ';
      font-size: 1.2rem;
    }

    .sub-item:active {
      transform: scale(0.94);
      background: #725AC1;
    }

    .definition-toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #2c2a2f;
      color: #F7ECE1;
      padding: 16px 32px;
      border-radius: 60px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 1rem;
      box-shadow: 0 20px 40px rgba(114, 90, 193, 0.35);
      backdrop-filter: blur(12px);
      background: rgba(44, 42, 47, 0.9);
      border: 1px solid rgba(141, 134, 201, 0.5);
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.35s ease, transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      letter-spacing: 0.3px;
      max-width: 90vw;
      text-align: center;
      line-height: 1.4;
      word-break: break-word;
    }
    .definition-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(44, 42, 47, 0.7);
      backdrop-filter: blur(4px);
      z-index: 10000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.active {
      display: flex;
    }

    .modal-dialog {
      background: #F7ECE1;
      border-radius: 28px;
      padding: 32px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(114, 90, 193, 0.3);
      animation: modalEntry 0.4s ease forwards;
      border: 2px solid rgba(202, 196, 206, 0.4);
    }

    @keyframes modalEntry {
      0% { opacity: 0; transform: scale(0.9) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }
    .modal-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: #725AC1;
      margin-bottom: 8px;
    }
    .modal-message {
      font-size: 1rem;
      color: #4b4752;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .modal-chapter-name {
      font-weight: 600;
      color: #8D86C9;
      background: rgba(202, 196, 206, 0.2);
      padding: 4px 16px;
      border-radius: 40px;
      display: inline-block;
      margin: 8px 0;
    }
    .modal-btn {
      display: inline-block;
      padding: 14px 32px;
      background: linear-gradient(135deg, #CAC4CE, #8D86C9);
      color: #F7ECE1;
      border-radius: 60px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(114, 90, 193, 0.2);
    }
    .modal-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(114, 90, 193, 0.3);
      background: linear-gradient(135deg, #8D86C9, #725AC1);
    }
    .modal-btn::before {
      content: '\2190 ';
      font-size: 1.1rem;
    }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: #CAC4CE;
      transition: 0.2s;
      line-height: 1;
    }
    .modal-close:hover {
      color: #725AC1;
      transform: scale(1.2);
    }

    @media (max-width: 768px) {
      .container { padding: 24px 20px; }
      .page-title { font-size: 2.2rem; }
      .chapter-card { padding: 20px 22px 24px; border-radius: 28px; }
      .chapter-title-link { font-size: 1.4rem; }
      .chapter-nr { font-size: 1.4rem; }
      .sub-item { font-size: 0.9rem; padding: 7px 16px; }
      .sub-list { gap: 8px 12px; }
      .modal-dialog { padding: 24px; }
      .modal-title { font-size: 1.3rem; }
    }

    @media (max-width: 600px) {
      .navbar { padding: 0 18px; }
      .nav-branding { font-size: 1.8rem; }
      .container { padding: 20px 16px; }
      .page-title { font-size: 2rem; }
      .chapter-card { padding: 18px 18px 22px; border-radius: 24px; }
      .chapter-title-link { font-size: 1.3rem; }
      .chapter-nr { font-size: 1.3rem; }
      .sub-item { font-size: 0.85rem; padding: 6px 14px; }
      .sub-list { gap: 8px 10px; }
      .definition-toast {
        padding: 14px 24px;
        font-size: 0.9rem;
        bottom: 24px;
      }
    }

    @media (max-width: 400px) {
      .container { padding: 16px 12px; }
      .page-title { font-size: 1.7rem; }
      .chapter-card { padding: 16px 14px 18px; border-radius: 20px; }
      .chapter-title-link { font-size: 1.15rem; }
      .chapter-nr { font-size: 1.1rem; }
      .sub-item { font-size: 0.8rem; padding: 5px 12px; }
      .modal-dialog { padding: 20px 16px; }
      .modal-title { font-size: 1.2rem; }
      .modal-btn { padding: 12px 24px; font-size: 0.9rem; }
    }

    a:focus-visible, .sub-item:focus-visible, .chapter-title-link:focus-visible, .modal-btn:focus-visible {
      outline: 3px solid #8D86C9;
      outline-offset: 4px;
      border-radius: 40px;
    }
  </style>
</head>
<body>
  <header>
    <nav class="navbar">
      <a href="index.html" class="nav-branding">C#</a>
      <ul class="nav-menu">
        <li class="nav-item"><a href="index.html" class="nav-link">Acasă</a></li>
        <li class="nav-item"><a href="capitole.html" class="nav-link" style="border-bottom: 2px solid #FFEEDD;">Capitole</a></li>
        <li class="nav-item"><a href="compilator.html" class="nav-link">Compilator</a></li>
      </ul>
      <div class="hamburger" aria-label="meniu" role="button" tabindex="0">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>
    </nav>
  </header>

  <main>
    <div class="container">
      <h1 class="page-title">Toate capitolele C#</h1>

      <div class="chapters-grid" id="chaptersGrid">
      </div>

      <a href="index.html" class="back-link">Inapoi la Acasa</a>
    </div>
  </main>

  <div class="modal-overlay" id="unavailableModal">
    <div class="modal-dialog">
      <div class="modal-icon">&#128218;</div>
      <div class="modal-title">Capitol indisponibil</div>
      <div class="modal-message">
        Capitolul <span class="modal-chapter-name" id="modalChapterName"></span> nu a fost inca realizat.
        <br>Reveniti mai tarziu pentru continut complet.
      </div>
      <a href="capitole.html" class="modal-btn">Inapoi la capitole</a>
    </div>
  </div>

  <script>
    (function() {
      const chaptersData = [
        {
          nr: "01",
          title: "Introducere in C# si .NET",
          file: "1.html",
          desc: "Bazele platformei, istoric, instalare si primul program Hello World.",
          subchapters: [
            { label: "Ce este .NET?", definition: "Platforma software gratuita, open-source, pentru construirea de aplicatii moderne. Ofera runtime, biblioteci si compilatoare." },
            { label: "Instalare SDK", definition: "Set de instrumente care include compilatorul C#, runtime-ul .NET si bibliotecile necesare pentru dezvoltare." },
            { label: "Primul program", definition: "Creati o aplicatie consola simpla care afiseaza Hello World pentru a verifica mediul de lucru." },
            { label: "Structura solutiei", definition: "Organizarea proiectelor C# in solutii, cu fisiere .csproj, foldere si dependente." }
          ]
        },
        {
          nr: "02",
          title: "Sintaxa de baza",
          file: "2.html",
          desc: "Variabile, tipuri de date, operatori, conversii si citirea de la tastatura.",
          subchapters: [
            { label: "Variabile si constante", definition: "Spatii de memorie numite care stocheaza date; constantele (const) nu pot fi modificate dupa initializare." },
            { label: "Tipuri de date", definition: "int, double, char, string, bool – definesc natura valorilor si operatiile permise asupra lor." },
            { label: "Operatori", definition: "Simboluri care efectueaza operatii: aritmetici (+, -), relationali (==, <) si logici (&&, ||)." },
            { label: "Conversii", definition: "Transformarea unei valori dintr-un tip in altul: implicita (fara pierderi) sau explicita (cast)." },
            { label: "Citire / scriere", definition: "Console.ReadLine() si Console.WriteLine() pentru interactiunea cu utilizatorul in consola." }
          ]
        },
        {
          nr: "03",
          title: "Instructiuni de control",
          file: "3.html",
          desc: "Decizii, bucle si salturi – fluxul executiei in C#.",
          subchapters: [
            { label: "if / else", definition: "Executa un bloc de cod doar daca o conditie booleana este adevarata; else ofera o ramura alternativa." },
            { label: "switch", definition: "Selecteaza o ramura de executie pe baza valorii unei expresii, util pentru mai multe cazuri fixe." },
            { label: "for / foreach", definition: "for: bucla cu contor; foreach: itereaza prin fiecare element al unei colectii fara a folosi un index." },
            { label: "while / do-while", definition: "while evalueaza conditia inainte de fiecare iteratie; do-while executa corpul cel putin o data." },
            { label: "break / continue", definition: "break iese imediat din bucla; continue trece la urmatoarea iteratie, sarind peste restul codului." }
          ]
        },
        {
          nr: "04",
          title: "Metode si functii",
          file: "4.html",
          desc: "Declarare, parametri, return, supraincarcare si metode statice.",
          subchapters: [
            { label: "Declarare metode", definition: "Bloc de cod cu un nume, care poate fi apelat; definit cu tip returnat, nume si parametri optionali." },
            { label: "Parametri", definition: "Valori transmise metodei la apel; pot fi by value, reference (ref) sau de iesire (out)." },
            { label: "Return", definition: "Instructiunea care trimite o valoare inapoi catre apelant si incheie executia metodei." },
            { label: "Overloading", definition: "Mai multe metode cu acelasi nume dar parametri diferiti (numar, tip sau ordine)." },
            { label: "Metode statice", definition: "Metode care apartin clasei, nu unei instante; se apeleaza cu numele clasei (ex: Math.Sqrt)." }
          ]
        },
        {
          nr: "05",
          title: "OOP – clase si obiecte",
          file: "5.html",
          desc: "Fundamentele programarii orientate pe obiecte in C#.",
          subchapters: [
            { label: "Clase si obiecte", definition: "Clasa este un sablon; obiectul este o instanta a clasei, cu stare si comportament propriu." },
            { label: "Campuri si proprietati", definition: "Campurile stocheaza date; proprietatile (get/set) ofera acces controlat la aceste date." },
            { label: "Constructori", definition: "Metode speciale apelate la crearea unui obiect, utilizate pentru initializarea membrilor." },
            { label: "this / static", definition: "this se refera la instanta curenta; static indica un membru care apartine clasei, nu unei instante." },
            { label: "Destructori", definition: "Metoda numita ~ClassName(), apelata automat de garbage collector pentru curatenie (rar folosita)." }
          ]
        },
        {
          nr: "06",
          title: "Mostenire si polimorfism",
          file: "6.html",
          desc: "Extinderea claselor, suprascrierea metodelor si interfete.",
          subchapters: [
            { label: "Mostenire", definition: "O clasa derivata preia membrii unei clase de baza, permitand reutilizarea si extinderea codului." },
            { label: "base / override", definition: "base acceseaza membrii clasei parinte; override modifica o metoda virtuala in clasa derivata." },
            { label: "Polimorfism", definition: "Capacitatea unui obiect de a lua mai multe forme, prin metode virtuale si referinte de tipul de baza." },
            { label: "Clase abstracte", definition: "Clase care nu pot fi instantiate direct; pot contine metode abstracte fara implementare." },
            { label: "Interfete", definition: "Contracte care definesc semnaturi de metode si proprietati; o clasa poate implementa mai multe interfete." }
          ]
        },
        {
          nr: "07",
          title: "Colectii si generice",
          file: "7.html",
          desc: "Liste, dictionare, cozi, stive si tipuri generice.",
          subchapters: [
            { label: "List<T>", definition: "Colectie dinamica, indexata, care permite adaugarea, eliminarea si cautarea rapida a elementelor." },

      function checkChapterAvailability(fileName) {
        return availableChapters.includes(fileName);

      function showUnavailableModal(chapterTitle) {
        modalChapterName.textContent = chapterTitle;
        unavailableModal.classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      function hideUnavailableModal() {
        unavailableModal.classList.remove('active');
        document.body.style.overflow = '';
      }

          hideUnavailableModal();
        }
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && unavailableModal.classList.contains('active')) {
          hideUnavailableModal();
        }
      });

      function buildChapters() {
        chaptersGrid.innerHTML = '';
        chaptersData.forEach((chapter, index) => {
          const card = document.createElement('div');
          card.className = 'chapter-card';
          card.style.animationDelay = (index * 0.03) + 's';
          
          let subHtml = '';
          chapter.subchapters.forEach(sub => {
            subHtml += '<a href="#" class="sub-item" data-definition="' + escapeHtml(sub.definition) + '">' + escapeHtml(sub.label) + '</a>';
          });

          const isAvailable = checkChapterAvailability(chapter.file);
          
          let titleHtml;
          if (isAvailable) {
            titleHtml = '<a href="capitole/' + escapeHtml(chapter.file) + '" class="chapter-title-link">' + escapeHtml(chapter.title) + '</a>';
          } else {
            titleHtml = '<a href="#" class="chapter-title-link unavailable" data-chapter-title="' + escapeHtml(chapter.title) + '" data-chapter-nr="' + escapeHtml(chapter.nr) + '">' + escapeHtml(chapter.title) + '</a>';
          }
          
          card.innerHTML = 
            '<div class="chapter-header">' +
              '<span class="chapter-nr">' + escapeHtml(chapter.nr) + '</span>' +
              titleHtml +
            '</div>' +
            '<div class="chapter-desc">' + escapeHtml(chapter.desc) + '</div>' +
            '<div class="sub-list">' +
              subHtml +
            '</div>';
          chaptersGrid.appendChild(card);
        });

        document.querySelectorAll('.chapter-title-link.unavailable').forEach(link => {
          link.addEventListener('click', function(e) {
            e.preventDefault();
            const chapterTitle = this.getAttribute('data-chapter-title');
            const chapterNr = this.getAttribute('data-chapter-nr');
            showUnavailableModal('Capitolul ' + chapterNr + ': ' + chapterTitle);
          });
        });
      }
      
      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function showDefinitionToast(definitionText, subLabel) {
        const oldToast = document.querySelector('.definition-toast');
        if (oldToast) oldToast.remove();

        const toast = document.createElement('div');
        toast.className = 'definition-toast';
        toast.textContent = subLabel + ': ' + definitionText;
        document.body.appendChild(toast);
        
        requestAnimationFrame(() => {
          toast.classList.add('show');
        });
        
        setTimeout(() => {
          toast.classList.remove('show');
          setTimeout(() => {
            if (toast.parentNode) toast.remove();
          }, 400);
        }, 3200);
      }

      function attachSubItemEvents() {
        const subItems = document.querySelectorAll('.sub-item');
        subItems.forEach(item => {
          item.addEventListener('click', function(e) {
            e.preventDefault();
            const definition = this.getAttribute('data-definition');
            const label = this.textContent.trim();
            
            this.style.transition = '0.15s';
            this.style.transform = 'scale(0.92)';
            setTimeout(() => {
              this.style.transform = 'scale(1.03)';
            }, 100);
            setTimeout(() => {
              this.style.transform = 'scale(1)';
            }, 250);

            if (definition) {
              showDefinitionToast(definition, label);
            } else {
              showDefinitionToast('Definitia va fi disponibila in curand.', label);
            }
          });
        });
      }

      const hamburger = document.querySelector('.hamburger');
      const navMenu = document.querySelector('.nav-menu');

      function toggleMenu() {
        hamburger.classList.toggle('active');
        navMenu.classList.toggle('active');
      }

      hamburger.addEventListener('click', toggleMenu);
      document.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', () => {
          if (navMenu.classList.contains('active')) {
            hamburger.classList.remove('active');
            navMenu.classList.remove('active');
          }
        });
      });

      document.addEventListener('click', (e) => {
        const isMenuOpen = navMenu.classList.contains('active');
        if (isMenuOpen && !e.target.closest('nav') && !e.target.closest('.hamburger')) {
          hamburger.classList.remove('active');
          navMenu.classList.remove('active');
        }
      });

      hamburger.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggleMenu();
        }
      });

      buildChapters();
      attachSubItemEvents();
    })();
  </script>
</body>
</html>
